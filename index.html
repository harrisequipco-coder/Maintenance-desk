:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e8f1fb;background:#091724;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #67b6ff;outline-offset:2px}.shell{max-width:660px;margin:auto;padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom))}header{padding:26px 20px 16px;background:linear-gradient(140deg,#173652,#0b2032);border-bottom:1px solid #254058}header .eyebrow{color:#8db4d6;letter-spacing:.13em;font-size:11px;font-weight:800}h1{margin:6px 0 2px;font-size:29px;letter-spacing:-.8px}header p{margin:0;color:#b0c3d4;font-size:13px}.page{padding:20px 16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading{font-size:19px;font-weight:750;letter-spacing:-.3px;margin:3px 0 15px}.subtle{color:#96aec2;font-size:13px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:24px}.tile{background:#142b3e;border:1px solid #254157;padding:14px 12px;border-radius:16px}.tile strong{display:block;font-size:28px;line-height:1.2}.tile span{color:#a7bdd0;font-size:11px}.tile.warning strong{color:#ffbe79}.tile.positive strong{color:#7ee0b1}.section{margin:20px 0 9px;font-weight:700;color:#cde0ed;font-size:14px}.card{background:#12293a;border:1px solid #29465c;border-radius:17px;padding:15px;margin:10px 0;box-shadow:0 6px 20px #0001}.card-title{font-size:16px;font-weight:740;margin:0 0 6px;overflow-wrap:anywhere}.muted{color:#a7bbca;font-size:12px}.pill{font-size:11px;font-weight:750;border-radius:50px;padding:5px 9px;white-space:nowrap;background:#254258;color:#cae5f9}.pill.open{background:#513b25;color:#ffd399}.pill.progress{background:#153e63;color:#9dd4ff}.pill.done{background:#164639;color:#a3f2cc}.pill.high{background:#542e35;color:#ffc3c7}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:1px solid #36556b;background:#1a364a;color:#eaf4ff;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:700}.btn.primary{background:#2498e8;color:#071c2b;border-color:#2498e8}.btn.danger{color:#ffb7b7}.fab{border:0;border-radius:13px;background:#35a6f4;color:#071c29;font-weight:800;padding:12px 15px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#0d2131ed;backdrop-filter:blur(14px);border-top:1px solid #2c4658;padding:9px 8px calc(8px + env(safe-area-inset-bottom));z-index:2}.tabwrap{display:grid;grid-template-columns:repeat(4,1fr);max-width:660px;width:100%}.tab{background:none;border:0;color:#96aebf;display:flex;flex-direction:column;gap:3px;align-items:center;padding:6px 3px;font-size:11px}.tab svg{width:22px;height:22px}.tab.active{color:#77c5ff}.search{width:100%;background:#132d40;color:#fff;border:1px solid #345369;border-radius:12px;padding:12px;margin:0 0 10px}.empty{border:1px dashed #36546a;padding:27px 16px;text-align:center;border-radius:16px;color:#b1c8d8;font-size:14px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-weight:680;font-size:13px;color:#d9eafa}.field input,.field select,.field textarea{background:#0d2232;border:1px solid #3a576b;border-radius:10px;color:#fff;padding:12px;width:100%;font-size:16px}.field textarea{min-height:85px;resize:vertical}dialog{background:#102638;border:1px solid #3b596e;color:#f0f7ff;border-radius:19px;width:calc(100% - 24px);max-width:570px;max-height:88dvh;padding:0;box-shadow:0 18px 80px #0009}dialog::backdrop{background:#020910c9}.dialog-head{padding:18px 18px 10px;border-bottom:1px solid #2c485d;font-size:19px;font-weight:800}.dialog-body{padding:8px 18px 20px;overflow:auto;max-height:calc(88dvh - 66px)}.smallhelp{font-size:12px;line-height:1.5;color:#9cb8cb}.select-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.select-row select{background:#173246;color:#f2f8ff;border:1px solid #35546a;border-radius:10px;padding:8px;font-size:13px;max-width:100%}.detail{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:#cbdfed;font-size:13px;line-height:1.55}.footer-note{margin:20px 2px;color:#8aa6bb;font-size:12px;line-height:1.6}.banner{background:#163649;border:1px solid #33617a;border-radius:12px;padding:12px;font-size:13px;color:#d8efff;margin-bottom:15px}.hidden{display:none!important}@media(min-width:620px){.page{padding:24px}.tiles{gap:14px}.tile{padding:18px}}
</style></head><body><div class="shell"><header><div class="eyebrow">FIELD SERVICE • VERSION 1.0</div><h1>Maintenance Desk</h1><p>Your equipment and work orders, all in one place.</p></header><main class="page" id="main"></main></div><nav class="tabs" aria-label="Main navigation"><div class="tabwrap" id="nav"></div></nav><dialog id="dialog"><div class="dialog-head" id="dialogTitle"></div><div class="dialog-body" id="dialogBody"></div></dialog><input id="importFile" type="file" accept="application/json,.json" hidden><script>
'use strict';const KEY='maintenance-desk-v1';const $=s=>document.querySelector(s);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);const today=()=>new Date().toISOString().slice(0,10);const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const validStatus=['Open','In progress','Completed'];const blank=()=>({equipment:[],orders:[]});let db=load(),tab='home',query='',statusFilter='All';function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.orders)&&Array.isArray(v.equipment))return v}catch(e){}return blank()}function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function fmt(d){if(!d)return 'No due date';const parts=String(d).split('-');if(parts.length!==3)return safe(d);return new Date(Number(parts[0]),Number(parts[1])-1,Number(parts[2])).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function eqName(id){return db.equipment.find(e=>e.id===id)?.name||'No equipment assigned'}function pill(txt,style=''){return `<span class="pill ${style}">${safe(txt)}</span>`}function orderCard(o){return `<article class="card"><div class="row"><div class="card-title">${safe(o.title)}</div>${pill(o.status,o.status==='Completed'?'done':o.status==='In progress'?'progress':'open')}</div><div class="muted">${safe(eqName(o.equipmentId))} · Due ${safe(fmt(o.due))}</div><div class="actions">${pill(o.priority+' priority',o.priority==='High'?'high':'')}<button class="btn" data-action="order" data-id="${safe(o.id)}">View / Edit</button></div></article>`}function equipmentCard(e){const count=db.orders.filter(o=>o.equipmentId===e.id).length;return `<article class="card"><div class="row"><div class="card-title">${safe(e.name)}</div>${pill(count+' jobs')}</div><div class="muted">${safe(e.location||'No location')} · ${safe(e.asset||'No asset ID')}</div>${e.notes?`<div class="detail">${safe(e.notes)}</div>`:''}<div class="actions"><button class="btn" data-action="equipment" data-id="${safe(e.id)}">View / Edit</button><button class="btn" data-action="addorder" data-id="${safe(e.id)}">+ Work order</button></div></article>`}function setTab(t){tab=t;query='';statusFilter='All';render()}const icons={home:'<path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/>',orders:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3.5h6M8 9h8M8 13h8M8 17h5"/>',equipment:'<path d="M14 6a5 5 0 0 0-6 6l-5 5a2 2 0 0 0 3 3l5-5a5 5 0 0 0 7-6l-3 3-3-3z"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M19 5l-2 2M7 17l-2 2"/>'};function render(){const countOpen=db.orders.filter(o=>o.status!=='Completed').length, overdue=db.orders.filter(o=>o.status!=='Completed'&&o.due&&o.due<today()).length;let html='';if(tab==='home'){let pending=[...db.orders].filter(o=>o.status!=='Completed').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,5);html=`<div class="row"><div class="heading">Overview</div><button class="fab" data-action="addorder">+ New job</button></div><div class="tiles"><div class="tile"><strong>${db.equipment.length}</strong><span>Assets</span></div><div class="tile warning"><strong>${countOpen}</strong><span>Active jobs</span></div><div class="tile ${overdue?'warning':'positive'}"><strong>${overdue}</strong><span>Overdue</span></div></div><div class="row"><div class="section">Upcoming work</div><button class="btn" data-tab="orders">All jobs</button></div>${pending.length?pending.map(orderCard).join(''):'<div class="empty">No active work orders yet.<br>Add your first job to get started.</div>'}<div class="section">Quick actions</div><div class="actions"><button class="btn" data-action="addequipment">+ Add equipment</button><button class="btn" data-action="export">Back up data</button></div>`}if(tab==='orders'){const filtered=db.orders.filter(o=>(statusFilter==='All'||o.status===statusFilter)&&(`${o.title} ${o.notes||''} ${eqName(o.equipmentId)}`).toLowerCase().includes(query.toLowerCase())).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));html=`<div class="row"><div class="heading">Work orders</div><button class="fab" data-action="addorder">+ New</button></div><input class="search" id="search" placeholder="Search work orders" value="${safe(query)}" aria-label="Search work orders"><div class="select-row"><select id="filter" aria-label="Filter by status">${['All',...validStatus].map(x=>`<option ${x===statusFilter?'selected':''}>${x}</option>`).join('')}</select><span class="subtle">${filtered.length} matching</span></div>${filtered.length?filtered.map(orderCard).join(''):'<div class="empty">No matching work orders.</div>'}`}if(tab==='equipment'){const items=db.equipment.filter(e=>`${e.name} ${e.location||''} ${e.asset||''}`.toLowerCase().includes(query.toLowerCase()));html=`<div class="row"><div class="heading">Equipment</div><button class="fab" data-action="addequipment">+ Add</button></div><input class="search" id="search" placeholder="Search assets and locations" value="${safe(query)}" aria-label="Search equipment">${items.length?items.map(equipmentCard).join(''):'<div class="empty">No equipment records found.<br>Add an asset to start your register.</div>'}`}if(tab==='settings'){html=`<div class="heading">Data & settings</div><div class="banner">Your records are saved in this browser on this device. They are not automatically synced to another iPhone or the cloud.</div><div class="card"><div class="card-title">Back up your work</div><p class="smallhelp">Export a JSON backup to Files or iCloud Drive. Keep backups regularly in case browser data is cleared or your phone is replaced.</p><div class="actions"><button class="btn primary" data-action="export">Export backup</button><button class="btn" data-action="import">Import backup</button></div></div><div class="card"><div class="card-title">Demo data</div><p class="smallhelp">Add three sample equipment records and three example work orders to explore the app.</p><button class="btn" data-action="demo">Load demo examples</button></div><div class="card"><div class="card-title">Reset</div><p class="smallhelp">Delete all local records on this device. This cannot be undone without a backup.</p><button class="btn danger" data-action="reset">Erase all records</button></div><div class="footer-note">Maintenance Desk v1.0 · Built for iPhone · Works offline after its first successful website load, on supported browsers. No account required.</div>`}$('#main').innerHTML=html;$('#nav').innerHTML=[['home','Home'],['orders','Jobs'],['equipment','Equipment'],['settings','Settings']].map(([k,label])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]}</svg>${label}</button>`).join('');const input=$('#search');if(input){input.addEventListener('input',e=>{const pos=e.target.selectionStart;query=e.target.value;const sc=window.scrollY;render();const next=$('#search');next.focus();next.setSelectionRange(pos,pos);window.scrollTo(0,sc)})}$('#filter')?.addEventListener('change',e=>{statusFilter=e.target.value;render()})}function modal(title,html){$('#dialogTitle').textContent=title;$('#dialogBody').innerHTML=html;$('#dialog').showModal()}function buttons(){return `<div class="actions"><button type="submit" class="btn primary">Save</button><button type="button" class="btn" data-action="close">Cancel</button></div>`}function editEquipment(id){const e=db.equipment.find(x=>x.id===id)||{name:'',asset:'',location:'',notes:''};modal(id?'Edit equipment':'Add equipment',`<form id="assetForm"><div class="field"><label for="name">Equipment name *</label><input id="name" name="name" maxlength="120" value="${safe(e.name)}" required placeholder="e.g. Bunn Coffee Brewer"></div><div class="field"><label for="asset">Asset / serial number</label><input id="asset" name="asset" maxlength="120" value="${safe(e.asset)}"></div><div class="field"><label for="location">Location</label><input id="location" name="location" maxlength="160" value="${safe(e.location)}" placeholder="Building, store or room"></div><div class="field"><label for="notes">Equipment notes</label><textarea id="notes" name="notes" maxlength="4000">${safe(e.notes)}</textarea></div>${buttons()}${id?'<div class="actions"><button type="button" class="btn danger" data-action="deleteequipment" data-id="'+safe(id)+'">Delete equipment</button></div>':''}</form>`);$('#assetForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);const item={...e,id:id||uid(),name:String(f.get('name')).trim(),asset:String(f.get('asset')).trim(),location:String(f.get('location')).trim(),notes:String(f.get('notes')).trim()};if(!item.name)return;id?db.equipment=db.equipment.map(x=>x.id===id?item:x):db.equipment.push(item);$('#dialog').close();save()}}function editOrder(id,equipmentId){const o=db.orders.find(x=>x.id===id)||{title:'',equipmentId:equipmentId||'',priority:'Normal',status:'Open',due:'',assigned:'',notes:''};modal(id?'Edit work order':'New work order',`<form id="orderForm"><div class="field"><label for="title">Job / problem description *</label><input name="title" id="title" maxlength="160" required value="${safe(o.title)}" placeholder="e.g. Replace leaking water valve"></div><div class="field"><label for="equipmentId">Equipment</label><select id="equipmentId" name="equipmentId"><option value="">Unassigned</option>${db.equipment.map(e=>`<option value="${safe(e.id)}" ${e.id===o.equipmentId?'selected':''}>${safe(e.name)} — ${safe(e.location)}</option>`).join('')}</select></div><div class="field"><label for="status">Status</label><select id="status" name="status">${validStatus.map(v=>`<option ${o.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="priority">Priority</label><select id="priority" name="priority">${['Low','Normal','High'].map(v=>`<option ${o.priority===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="due">Due date</label><input id="due" type="date" name="due" value="${safe(o.due)}"></div><div class="field"><label for="assigned">Assigned to</label><input name="assigned" id="assigned" maxlength="120" value="${safe(o.assigned)}" placeholder="Technician name"></div><div class="field"><label for="notes">Repair details / notes</label><textarea name="notes" id="notes" maxlength="8000" placeholder="What was found, parts needed, work performed...">${safe(o.notes)}</textarea></div>${buttons()}${id?'<div class="actions"><button class="btn danger" type="button" data-action="deleteorder" data-id="'+safe(id)+'">Delete work order</button></div>':''}</form>`);$('#orderForm').onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target),item={...o,id:id||uid(),title:String(f.get('title')).trim(),equipmentId:String(f.get('equipmentId')),status:String(f.get('status')),priority:String(f.get('priority')),due:String(f.get('due')),assigned:String(f.get('assigned')).trim(),notes:String(f.get('notes')).trim()};if(!item.title)return;id?db.orders=db.orders.map(x=>x.id===id?item:x):db.orders.push(item);$('#dialog').close();save()}}function download(){const blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maintenance-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function demo(){if(db.equipment.length||db.orders.length){if(!confirm('Add demo examples alongside your existing records?'))return}const e=[{id:uid(),name:'Coffee brewer',asset:'BR-001',location:'Store 1 · Kitchen',notes:'Check valves, spray head and temperature'},{id:uid(),name:'Walk-in cooler',asset:'REF-012',location:'Store 1 · Back room',notes:'Record temperatures on each visit'},{id:uid(),name:'Exhaust fan',asset:'HVAC-007',location:'Store 2 · Roof',notes:'Inspect belt and bearings'}];db.equipment.push(...e);db.orders.push({id:uid(),title:'Inspect brewer water valve',equipmentId:e[0].id,status:'Open',priority:'High',due:today(),assigned:'',notes:'Check for drip after heating cycle.'},{id:uid(),title:'Record cooler temperature',equipmentId:e[1].id,status:'In progress',priority:'Normal',due:'',assigned:'',notes:'Verify against setpoint.'},{id:uid(),title:'Replace exhaust fan belt',equipmentId:e[2].id,status:'Completed',priority:'Low',due:'',assigned:'',notes:'Example of a closed service job.'});save()}document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-action]');if(!el)return;const t=el.dataset.tab,a=el.dataset.action,id=el.dataset.id;if(t){setTab(t);return}if(a==='addequipment'||a==='equipment')editEquipment(a==='equipment'?id:null);else if(a==='addorder'||a==='order')editOrder(a==='order'?id:null,a==='addorder'?id:null);else if(a==='close')$('#dialog').close();else if(a==='export')download();else if(a==='import')$('#importFile').click();else if(a==='demo')demo();else if(a==='reset'&&confirm('Delete ALL equipment and work orders? Export a backup first if needed.')){db=blank();save()}else if(a==='deleteorder'&&confirm('Delete this work order?')){db.orders=db.orders.filter(o=>o.id!==id);$('#dialog').close();save()}else if(a==='deleteequipment'&&confirm('Delete equipment? Its work orders will stay but become unassigned.')){db.equipment=db.equipment.filter(o=>o.id!==id);db.orders=db.orders.map(o=>o.equipmentId===id?{...o,equipmentId:''}:o);$('#dialog').close();save()}});$('#importFile').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.orders)||!Array.isArray(data.equipment)||data.orders.length>25000||data.equipment.length>25000)throw Error('This file is not a valid Maintenance Desk backup.');if(!confirm('Import this backup and replace ALL current records?'))return;db={orders:data.orders.filter(o=>o&&typeof o.id==='string'&&typeof o.title==='string').map(o=>({id:o.id,title:o.title.slice(0,160),equipmentId:String(o.equipmentId||''),status:validStatus.includes(o.status)?o.status:'Open',priority:['Low','Normal','High'].includes(o.priority)?o.priority:'Normal',due:String(o.due||'').slice(0,10),assigned:String(o.assigned||'').slice(0,120),notes:String(o.notes||'').slice(0,8000)})),equipment:data.equipment.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string').map(x=>({id:x.id,name:x.name.slice(0,120),asset:String(x.asset||'').slice(0,120),location:String(x.location||'').slice(0,160),notes:String(x.notes||'').slice(0,4000)}))};save();alert('Backup imported successfully.')}catch(err){alert('Import failed: '+err.message)}finally{ev.target.value=''}});render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
